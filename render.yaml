# Render blueprint: New > Blueprint on https://render.com picks this up.
# MONGODB_URI is marked sync:false so Render asks you for it instead of
# keeping your Atlas password in this file.
services:
  - type: web
    name: codemaster-php
    runtime: node
    plan: free
    rootDir: server
    # With rootDir set, Render only auto-deploys when something under server/
    # changes. The game's pages, scripts and styles live in public/, so list
    # both folders here or front-end-only pushes are silently skipped.
    # (Paths are relative to the repository root.)
    buildFilter:
      paths:
        - server/**
        - public/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: codemaster_php
