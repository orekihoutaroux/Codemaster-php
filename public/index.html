<style>
    /* Shell-only: hidden until the page partials and game scripts finish loading. */
    #app-root { width: 100%; min-height: 100vh; }
    body.app-loading #app-root { visibility: hidden; }
    .app-boot-error {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; padding: 24px; text-align: center;
        background: #070719; color: #fff; font-family: 'Exo 2', sans-serif;
    }
    .app-boot-error small { color: #9aa0c8; }
</style>

<body class="app-loading">
<!--
===============================================================================
CODEMASTER PHP - PAGE MAP
===============================================================================
This is a single-page application assembled at runtime. index.html is only the
shell. js/loader.js fetches the partials below, injects them into #app-root,
then loads the ordered game scripts in js/.

PAGES      (public/pages/)
  title.html                PAGE 1  Home page and main navigation
  leaderboard.html          PAGE 2  Player rankings
  add-user.html             PAGE 3  Account creation and login
  select.html               PAGE 4  Character selection
  learn.html                PAGE 5  PHP study materials
  game.html                 PAGE 6  Battle, questions, statistics, progression

OVERLAYS   (public/overlays/)
  account-info.html         Current player account information
  shop.html                 Item shop
  settings.html             Audio, text, restart, and exit controls
  admin-login.html          Administrator authentication
  admin.html                Question and user management
  admin-reset-confirm.html  Reset confirmation dialog

LOGIC      (public/js/, loaded in numeric order — see loader.js)
STYLES     (public/css/, one file per former styles.css section)
===============================================================================
-->

<!-- SHARED BACKGROUND
     Function: createStars() builds the star field used behind every page. -->
<div class="stars" id="stars"></div>

<div class="title-atmosphere global-atmosphere" aria-hidden="true">
