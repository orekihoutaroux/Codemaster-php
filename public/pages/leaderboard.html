<!-- ========================================================================
     PAGE 2: LEADERBOARD
     Purpose: Displays player scores, heroes, roles, year levels, blocks and
              highest floors.
     Functions: showLeaderboard(), renderLeaderboard(), showScreen()
     ======================================================================== -->
<div id="leaderboard-screen" class="screen">
    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h1>TOP PLAYERS</h1>
            <p class="leaderboard-subtitle">Champions of PHP Mastery</p>
        </div>
        <div class="leaderboard-table">
            <div class="leaderboard-row header-row">
                <div class="col rank">RANK</div>
                <div class="col name">PLAYER</div>
                <div class="col character">HERO</div>
                <div class="col role">ROLE</div>
                <div class="col year">YEAR</div>
                <div class="col block">BLOCK</div>
                <div class="col score">SCORE</div>
                <div class="col floor">FLOOR</div>
            </div>
            <div id="leaderboard-list"></div>
        </div>
        <button class="confirm-btn leaderboard-back" onclick="showScreen('title-screen')">BACK TO HOME</button>
    </div>
</div>
